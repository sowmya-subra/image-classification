{% extends "base.html" %}

{% block title %}Sign in | MNIST Digit Classifier{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Sign in</h1>
        <p class="auth-sub">Enter your credentials to view the write-up and classifier.</p>

        {% if form.errors %}
            <div class="alert alert-error">Incorrect username or password.</div>
        {% endif %}

        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="button button-primary button-block">Sign in</button>
        </form>
    </div>
</div>
{% endblock %}
