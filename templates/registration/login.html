<!DOCTYPE html>
<html>
<head>
    <title>Sign in</title>
</head>
<body>
    <h1>Sign in</h1>

    {% if form.errors %}
        <p>Incorrect username or password.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign in</button>
    </form>
</body>
</html>
